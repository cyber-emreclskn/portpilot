[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "portpilot"
version = "0.2.0"
description = "Interactive terminal port manager for developers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emre Çalışkan", email = "osmancalskan7@gmail.com" }]
requires-python = ">=3.10"
keywords = ["port", "process", "terminal", "tui", "developer", "tools", "kill", "network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "textual>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "psutil>=6.0.0",
]

[project.scripts]
portpilot = "portpilot.cli:main"
pp = "portpilot.cli:main"

[project.urls]
Homepage = "https://github.com/cyber-emreclskn/portpilot"
Documentation = "https://github.com/cyber-emreclskn/portpilot#readme"
Repository = "https://github.com/cyber-emreclskn/portpilot"
Issues = "https://github.com/cyber-emreclskn/portpilot/issues"
Changelog = "https://github.com/cyber-emreclskn/portpilot/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "mypy>=1.13",
    "types-psutil",
    "pre-commit>=4.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
]

[tool.hatch.build.targets.sdist]
include = ["portpilot", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "C4",           # comprehensions
    "A",            # shadowing builtins (would have caught `def list`)
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "PT",           # pytest style
]
ignore = ["E501", "RUF001"]  # long lines handled by formatter; emoji in strings are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
packages = ["portpilot"]

[[tool.mypy.overrides]]
module = ["textual.*"]
disallow_subclassing_any = false
disallow_untyped_calls = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error::DeprecationWarning:portpilot.*"]

[tool.coverage.run]
source = ["portpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]
